<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBill AI</title>

    <link rel="stylesheet" href="style.css">

    <!-- OCR Library -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

</head>

<body>

<div class="container">

    <h1>SmartBill AI</h1>
    <p class="subtitle">Convert your bills into Excel</p>

    <div class="card">

        <input 
            type="file" 
            id="billImage" 
            accept="image/*"
        >

        <img id="preview" class="preview" />

        <button onclick="uploadBill()">
            Read Bill
        </button>

        <div id="status"></div>

        <h3>Extracted Details</h3>

        <textarea 
            id="billText"
            placeholder="Bill details will appear here..."
        ></textarea>


        <button onclick="downloadExcel()">
            Download Excel
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
